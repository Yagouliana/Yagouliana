<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Super deep dark background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#080B12"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Ultra-brushed titanium -->
    <linearGradient id="titanium" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(248,250,252,0.7)"/>
      <stop offset="30%" stop-color="rgba(210,220,240,0.5)"/>
      <stop offset="60%" stop-color="rgba(160,180,220,0.35)"/>
      <stop offset="100%" stop-color="rgba(90,110,170,0.2)"/>
    </linearGradient>

    <!-- Chrome edge with micro-facets -->
    <linearGradient id="chrome-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
      <stop offset="15%" stop-color="rgba(255,255,255,0.5)"/>
      <stop offset="35%" stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="65%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Deep AI core - electric -->
    <radialGradient id="ai-core" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#1A233F"/>
    </radialGradient>

    <!-- Neon cyber sweep -->
    <linearGradient id="sweep-cyber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(30,140,220,0.5)"/>
      <stop offset="25%" stop-color="rgba(0,180,230,0.6)"/>
      <stop offset="50%" stop-color="rgba(0,200,255,0.45)"/>
      <stop offset="75%" stop-color="rgba(0,160,210,0.3)"/>
      <stop offset="100%" stop-color="rgba(30,140,220,0.1)"/>
    </linearGradient>

    <!-- Hyper-cyan data pulse -->
    <linearGradient id="data-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <!-- Neural node with core glow -->
    <radialGradient id="neural-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>

    <!-- Outer edge chrome -->
    <linearGradient id="edge-chromed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>

    <!-- Deep shadow -->
    <filter id="deep-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="8" dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.32"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subsurface scattering -->
    <filter id="subsurface" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Premium Typography -->
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="900">
    <text x="60" y="108" fill="#F5F5F5" font-size="54" letter-spacing="-0.015em">YAGO ULIANA</text>
    <text x="60" y="145" fill="#CBD5E1" font-size="14" letter-spacing="0.15em" font-weight="500">SOFTWARE DEVELOPER</text>
    <text x="60" y="198" fill="#94A3B8" font-size="11" letter-spacing="0.3em">DATA · AI · SOFTWARE</text>
  </g>

  <!-- Advanced AI Sculpture - 3D Fluid Intelligence -->
  <g filter="url(#deep-shadow)" transform="translate(500, 40)">
    <!-- Primary fluid form - AI consciousness wave -->
    <path d="M460 230
             C420 180, 420 110, 480 80
             C510 65, 570 75, 600 100
             C630 130, 630 190, 580 220
             C540 240, 480 230, 460 220
             C440 210, 430 230, 460 230
             Z"
          fill="url(#titanium)" opacity="0.92"/>

    <!-- Secondary internal chamber - data core -->
    <path d="M475 210
             C445 180, 445 130, 490 110
             C520 95, 575 105, 600 125
             C625 145, 625 175, 575 200
             C540 215, 485 210, 475 205
             C460 195, 450 210, 475 210
             Z"
          fill="url(#ai-core)" opacity="0.68"/>

    <!-- Outer chrome edge - high gloss -->
    <path d="M455 120
             L605 120
             L590 140
             L470 140
             Z"
          fill="url(#chrome-edge)" opacity="0.75"/>

    <!-- Internal chrome detail -->
    <path d="M465 135 L595 135 L580 150 L480 150 Z"
          fill="url(#edge-chromed)" opacity="0.6"/>

    <!-- Cyber sweep across the sculpture -->
    <path d="M505 95 L585 80 L595 95 L560 115 Z"
          fill="url(#sweep-cyber)" opacity="0.28"/>

    <!-- Data pulse nodes - neural connections -->
    <circle cx="520" cy="100" r="4" fill="url(#neural-node)" opacity="0.7"/>
    <circle cx="555" cy="105" r="3.5" fill="url(#neural-node)" opacity="0.6"/>
    <circle cx="585" cy="110" r="3" fill="url(#neural-node)" opacity="0.5"/>
    <circle cx="540" cy="115" r="2.5" fill="#06B6D4" opacity="0.4"/>

    <!-- Hyper-cyan accent line -->
    <path d="M475 140 C500 130, 540 130, 565 140"
          fill="url(#data-pulse)" opacity="0.15"/>

    <!-- Subsurface glow for realism -->
    <g filter="url(#subsurface)">
      <path d="M480 215 C460 185, 460 140, 500 115 C530 100, 580 110, 605 130 C625 145, 620 175, 575 200 C540 215, 490 215, 480 215 Z"
            fill="rgba(0,0,0,0.12)"/>
    </g>
  </g>

  <!-- Floor reflection with depth -->
  <path d="M500 45 L720 45 C660 110, 620 150, 580 180 C540 150, 500 110, 440 45 Z"
        fill="rgba(255,255,255,0.06)" opacity="0.18"/>

  <!-- Vertical tech accent line -->
  <line x1="490" y1="40" x2="490" y2="265" stroke="rgba(37,99,235,0.04)" stroke-width="1"/>

  <!-- Footer -->
  <text x="1160" y="295" font-family="monospace" font-size="12" fill="#64748B" text-anchor="end" font-weight="500">PORTFOLIO · 2027</text>
</svg>